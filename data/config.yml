## Combined config for ctf01d
# use 2 spaces for tab

game:
  id: "cybersibir2025" # uniq gameid must be regexp [a-z0-9]+
  name: "CyberSibir 2025" # visible game name in scoreboard
  start: "2025-03-28 04:20:00" # start time of game (UTC)
  end: "2025-03-28 12:20:00" # end time of game (UTC)
  coffee_break_start: "2025-03-28 07:00:00" # start time of game coffee break (UTC), but it will be ignored if period more (or less) then start and end
  coffee_break_end: "2025-03-28 08:00:00" # end time of game coffee break (UTC), but it will be ignored if period more (or less) then start and end
  flag_timelive_in_min: 1 # you can change flag time live (in minutes)
  basic_costs_stolen_flag_in_points: 1 # basic costs stolen (attack) flag in points for adaptive scoreboard
  cost_defence_flag_in_points: 1.0 # cost defences flag in points

scoreboard:
  port: 8080 # http port for scoreboard
  htmlfolder: "./html" # web page for scoreboard see index-template.html
  random: no # If yes - will be random values in scoreboard

checkers:
  - id: "eyesee" # work directory will be checker_eyesee
    service_name: "EyeSee"
    enabled: yes
    script_path: "./checker.py"
    script_wait_in_sec: 10 # max time for running script
    time_sleep_between_run_scripts_in_sec: 30 # like a round for service
  - id: "mspd" # work directory will be checker_mspd
    service_name: "MSPD"
    enabled: yes
    script_path: "./checker.py"
    script_wait_in_sec: 10
    time_sleep_between_run_scripts_in_sec: 30
  - id: "ncdex" # work directory will be checker_ncdex
    service_name: "NcDEx"
    enabled: yes
    script_path: "./checker.rb"
    script_wait_in_sec: 10
    time_sleep_between_run_scripts_in_sec: 30
  - id: "unpleasant" # work directory will be checker_unpleasant
    service_name: "Unpleasant"
    enabled: yes
    script_path: "./checker.py"
    script_wait_in_sec: 10
    time_sleep_between_run_scripts_in_sec: 30
  - id: "wrnum" # work directory will be checker_wrnum
    service_name: "WrNum"
    enabled: yes
    script_path: "./checker.py"
    script_wait_in_sec: 10
    time_sleep_between_run_scripts_in_sec: 30
  - id: "bank" # work directory will be checker_bank
    service_name: "CyberBank"
    enabled: yes
    script_path: "./checker.py"
    script_wait_in_sec: 10
    time_sleep_between_run_scripts_in_sec: 30
  - id: "neli234" # work directory will be checker_neli234
    service_name: "NeuroLink234"
    enabled: yes
    script_path: "./checker.py"
    script_wait_in_sec: 15
    time_sleep_between_run_scripts_in_sec: 45
  - id: "bigu" # work directory will be checker_bigu
    service_name: "BioGuard"
    enabled: yes
    script_path: "./checker.py"
    script_wait_in_sec: 20
    time_sleep_between_run_scripts_in_sec: 60

